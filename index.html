<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wasly — намаз и каза в одном приложении</title>
<meta name="description" content="Точное время намаза и трекер возмещения каза. Без рекламы и лишнего шума.">
<link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/favicon/favicon-16.png" sizes="16x16" type="image/png">
<link rel="icon" href="assets/favicon/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF7;
    --paper: #FFFFFF;
    --ink: #2C2C2A;
    --ink-2: #6B6B66;
    --muted: #8C8C85;
    --hair: #EDEDE5;
    --green: #047857;
    --green-2: #036549;
    --green-soft: #C5DDD0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    line-height: 1.5;
    min-height: 100dvh;
    display: flex; flex-direction: column;
    overflow-x: hidden;
    position: relative;
    background-image:
      radial-gradient(ellipse 70% 55% at 12% 8%, rgba(4,120,87,.28), transparent 65%),
      radial-gradient(ellipse 60% 50% at 88% 92%, rgba(4,120,87,.22), transparent 65%),
      radial-gradient(circle 600px at 50% 50%, rgba(110,231,183,.10), transparent 70%);
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(circle, rgba(44,44,42,.14) 1px, transparent 1.6px);
    background-size: 26px 26px;
    mask-image: radial-gradient(ellipse 80% 70% at center, #000 25%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at center, #000 25%, transparent 80%);
    opacity: .8;
  }
  main, footer { position: relative; z-index: 1; }
  a { color: inherit; text-decoration: none; }

  main {
    flex: 1;
    display: grid; place-items: center;
    padding: 48px 24px;
  }
  .hero {
    width: 100%; max-width: 520px;
    text-align: center;
  }
  .logo {
    width: 76px; height: 76px;
    margin: 0 auto 16px;
    color: var(--green);
    display: grid; place-items: center;
  }
  .logo svg { width: 100%; height: 100%; }
  h1 {
    font-size: clamp(34px, 6vw, 44px);
    letter-spacing: -.03em; font-weight: 700;
    margin: 0 0 14px;
  }
  .tag {
    color: var(--ink-2);
    font-size: 17px;
    margin: 0 auto 36px;
    max-width: 420px;
  }
  .stores {
    display: flex; justify-content: center; gap: 10px;
    flex-wrap: wrap;
    max-width: 460px; margin: 0 auto;
  }
  .store {
    flex: 1 1 200px;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 12px 18px; border-radius: 14px;
    background: var(--ink); color: #fff;
    font-size: 14px; line-height: 1.1;
    transition: transform .2s ease, opacity .2s ease;
  }
  .store:hover { transform: translateY(-1px); }
  .store.disabled { opacity: .45; pointer-events: none; }
  .store svg { width: 22px; height: 22px; flex-shrink: 0; }
  .store .lab { text-align: left; }
  .store .lab span { display: block; font-size: 11px; opacity: .7; letter-spacing: .04em; }
  .store .lab strong { display: block; font-size: 15px; font-weight: 600; }

  footer {
    padding: 28px 24px 36px;
    border-top: 1px solid var(--hair);
    color: var(--muted); font-size: 13px;
  }
  .foot {
    max-width: 720px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
    gap: 16px; flex-wrap: wrap;
  }
  .foot .copy { display: flex; align-items: center; gap: 8px; }
  .foot .copy svg { width: 16px; height: 16px; color: var(--green); }
  .foot-links { display: flex; flex-wrap: wrap; gap: 12px 18px; }
  .foot-links a { color: var(--muted); }
  .foot-links a:hover { color: var(--ink); }

  @media (max-width: 540px) {
    .foot { flex-direction: column; align-items: flex-start; gap: 14px; }
  }
</style>
</head>
<body>

<main>
  <section class="hero">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round">
        <polygon points="50,16 60,26 74,26 74,40 84,50 74,60 74,74 60,74 50,84 40,74 26,74 26,60 16,50 26,40 26,26 40,26"/>
      </svg>
    </div>
    <h1>Wasly</h1>
    <p class="tag">Ассистент для духовных привычек. Время намазов, трекер каза. Без рекламы и лишнего шума.</p>

    <div class="stores">
      <a class="store" href="#" aria-label="Скачать в App Store">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 12.04c-.03-2.96 2.42-4.38 2.53-4.46-1.38-2.02-3.53-2.3-4.3-2.33-1.83-.19-3.57 1.08-4.5 1.08-.94 0-2.36-1.05-3.88-1.02-2 .03-3.84 1.16-4.87 2.94-2.08 3.6-.53 8.93 1.5 11.85.99 1.43 2.17 3.03 3.71 2.97 1.49-.06 2.06-.96 3.86-.96 1.8 0 2.31.96 3.88.93 1.6-.03 2.62-1.45 3.6-2.89 1.13-1.66 1.6-3.27 1.62-3.35-.04-.02-3.11-1.19-3.15-4.76zM14.46 3.32c.82-.99 1.37-2.37 1.22-3.74-1.18.05-2.6.78-3.45 1.77-.76.87-1.42 2.27-1.24 3.61 1.31.1 2.65-.66 3.47-1.64z"/></svg>
        <div class="lab"><span>Доступно в</span><strong>App Store</strong></div>
      </a>
      <a class="store" href="#" aria-label="Скачать в Google Play">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.609 1.814L13.792 12 3.609 22.186a.996.996 0 01-.61-.92V2.734a1 1 0 01.61-.92zm10.89 10.893l2.302 2.302-10.937 6.333 8.635-8.635zm3.199-3.198l2.807 1.626a1 1 0 010 1.73l-2.808 1.626L15.305 12l2.393-2.491zM5.864 2.658L16.802 8.99l-2.303 2.303L5.864 2.658z"/></svg>
        <div class="lab"><span>Доступно в</span><strong>Google Play</strong></div>
      </a>
    </div>
  </section>
</main>

<footer>
  <div class="foot">
    <div class="copy">
      <svg viewBox="0 0 100 100" fill="currentColor"><polygon points="50,16 60,26 74,26 74,40 84,50 74,60 74,74 60,74 50,84 40,74 26,74 26,60 16,50 26,40 26,26 40,26"/></svg>
      <span>© Wasly, 2026</span>
    </div>
    <div class="foot-links">
      <a href="terms.html">Условия</a>
      <a href="privacy.html">Приватность</a>
      <a href="oferta.html">Оферта</a>
    </div>
  </div>
</footer>

</body>
</html>
